        { id: "RJ126604", title: "【耳かき】耳かき安眠店 道草屋 せり ver1.5【耳舐め】", date: "2013-12-17", price: 770, age: "全年齢" },
        { id: "RJ125930", title: "【耳かき】耳かき安眠店 道草屋 すずしろ ver1.5【耳舐め】", date: "2013-11-30", price: 770, age: "全年齢" },
      ];

      const STORAGE_KEY = "michikusa-owned";
      const byId = new Map(WORKS.map((w) => [w.id, w]));
      // 個別作品 ID -> それを収録するセット ID の一覧
      const setsOf = new Map();
      for (const w of WORKS) {
        for (const child of w.includes ?? []) {
          if (!setsOf.has(child)) setsOf.set(child, []);
          setsOf.get(child).push(w.id);
        }
      }

      function loadOwned() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return new Set(raw ? JSON.parse(raw) : []);
        } catch {
          return new Set();
        }
      }
      function saveOwned(owned) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...owned]));
        } catch {
          /* private mode などで保存できなくても動作は続ける */
        }
      }

      const owned = loadOwned();
      const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY" });

      function workUrl(w) {
        const floor = w.age === "全年齢" ? "home" : "maniax";
        return `https://www.dlsite.com/${floor}/work/=/product_id/${w.id}.html`;
      }

      function render() {
        const tbody = document.getElementById("rows");
        tbody.replaceChildren();
        for (const w of WORKS) {
          const tr = document.createElement("tr");
          tr.dataset.id = w.id;
          const isSet = Boolean(w.includes);
          if (isSet) tr.classList.add("is-set");

          const noteParts = [];
          if (isSet) {
            noteParts.push(
              "収録: " + w.includes.map((id) => `<code>${id}</code>`).join(", ")
            );
          }
          if (setsOf.has(w.id)) {
            noteParts.push(
              "収録セット: " + setsOf.get(w.id).map((id) => `<code>${id}</code>`).join(", ")
            );
          }
          if (w.note) noteParts.push(w.note);

          tr.innerHTML = `
            <td class="chk"><input type="checkbox" id="chk-${w.id}" aria-label="購入済み: ${w.title}" /></td>
            <td class="id"><a href="${workUrl(w)}" rel="noopener" target="_blank">${w.id}</a></td>
            <td class="title">${isSet ? '<span class="badge set">セット</span>' : ""}<label for="chk-${w.id}">${w.title}</label></td>
            <td class="date">${w.date}</td>
            <td class="price">${yen.format(w.price)}</td>
            <td class="age">${w.age}</td>
            <td class="note">${noteParts.join("<br>")}</td>`;
          tbody.append(tr);
        }
        update();
      }

      function update() {
        // セットで網羅されている個別作品
        const covered = new Set();
        for (const id of owned) {
          for (const child of byId.get(id)?.includes ?? []) covered.add(child);
        }

        let remaining = 0;
        let total = 0;
        let ownedCount = 0;
        for (const w of WORKS) {
          const tr = document.querySelector(`tr[data-id="${w.id}"]`);
          const chk = tr.querySelector("input");
          const isOwned = owned.has(w.id);
          const isCovered = !isOwned && covered.has(w.id);
          chk.checked = isOwned || isCovered;
          chk.disabled = isCovered;
          chk.title = isCovered ? "セットで購入済み" : "";
          tr.classList.toggle("owned", isOwned);
          tr.classList.toggle("covered", isCovered);
          if (isOwned || isCovered) {
            ownedCount++;
          } else if (!w.includes) {
            // 未購入の集計はセットを除いた個別作品のみ
            remaining++;
            total += w.price;
          }
        }
        document.getElementById("stat-remaining").textContent = remaining;
        document.getElementById("stat-total").textContent = yen.format(total);
        document.getElementById("stat-owned").textContent = ownedCount;
        document.getElementById("stat-all").textContent = WORKS.length;
      }

      document.getElementById("rows").addEventListener("change", (e) => {
        const tr = e.target.closest("tr[data-id]");
        if (!tr) return;
        if (e.target.checked) owned.add(tr.dataset.id);
        else owned.delete(tr.dataset.id);
        saveOwned(owned);
        update();
      });

      document.getElementById("hide-owned").addEventListener("change", (e) => {
        document.body.classList.toggle("hide-owned", e.target.checked);
      });

      document.getElementById("reset").addEventListener("click", () => {
        owned.clear();
        saveOwned(owned);
        update();
      });

      document.getElementById("fetched-at").textContent = FETCHED_AT;
      render();
    </script>
  </body>
</html>
